name: todo_app
description: "DevCamp 2.0 Week 2 Compulsory Project: A polished, feature-rich To-Do List Flutter application with CRUD, input validation, categories, priorities, persistent storage, dark mode, search, and progress tracking."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true
